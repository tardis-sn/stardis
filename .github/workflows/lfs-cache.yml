name: Save LFS Cache

on:
  workflow_call:
    inputs:
      regression-data-repo:
        description: "Repository containing regression data (format: owner/repo)"
        required: false
        default: "tardis-sn/stardis-regression-data"
        type: string
      allow_lfs_pull:
        description: "If true, allows LFS pull operations"
        required: false
        default: false
        type: boolean
      atom-data-sparse:
        description: "If true, only cache the standard TARDIS atom-data file"
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash -l {0}

concurrency:
  # Only one workflow can run at a time
  # the workflow group is a unique identifier and contains the workflow name, pull request number, and regression data repo
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.regression-data-repo }}-${{ inputs.atom-data-sparse }}
  cancel-in-progress: true


jobs:
  lfs-cache:
    if: github.repository_owner == 'tardis-sn'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout regression data
        if: ${{ !inputs.atom-data-sparse }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.regression-data-repo }}
          path: stardis-regression-data

      - name: Checkout atom data
        if: ${{ inputs.atom-data-sparse }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.regression-data-repo }}
          path: tardis-regression-data
          sparse-checkout: atom_data/kurucz_cd23_chianti_H_He_latest.h5
    
      - name: Create LFS file list
        run: |
          if [ "${{ inputs.atom-data-sparse }}" = "true" ]; then
            git lfs ls-files -l | grep 'atom_data/kurucz_cd23_chianti_H_He_latest.h5' | cut -d' ' -f1 | sort > .lfs-files-list
          else
            git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-files-list
          fi
        working-directory: ${{ inputs.atom-data-sparse && 'tardis-regression-data' || 'stardis-regression-data' }}

      - name: Test cache availability
        uses: actions/cache/restore@v4
        id: test-lfs-cache-regression-data
        with:
          path: ${{ inputs.atom-data-sparse && 'tardis-regression-data/.git/lfs' || 'stardis-regression-data/.git/lfs' }}
          key: ${{ inputs.atom-data-sparse && format('stardis-regression-atom-data-{0}-{1}-v1', hashFiles('tardis-regression-data/.lfs-files-list'), inputs.regression-data-repo) || format('stardis-regression-full-data-{0}-{1}-v1', hashFiles('stardis-regression-data/.lfs-files-list'), inputs.regression-data-repo) }}
          lookup-only: true
  
      - name: Fail if LFS pull is needed but not allowed
        if: |
          steps.test-lfs-cache-regression-data.outputs.cache-hit != 'true' && 
          inputs.allow_lfs_pull != true
        run: |
          echo "Error: LFS pull is required but not allowed (allow_lfs_pull is false)"
          exit 1
      
      - name: Git LFS Pull
        if: |
          steps.test-lfs-cache-regression-data.outputs.cache-hit != 'true' && 
          inputs.allow_lfs_pull == true
        run: |
          if [ "${{ inputs.atom-data-sparse }}" = "true" ]; then
            git lfs pull --include="atom_data/kurucz_cd23_chianti_H_He_latest.h5" --exclude=""
          else
            git lfs pull
          fi
        working-directory: ${{ inputs.atom-data-sparse && 'tardis-regression-data' || 'stardis-regression-data' }}

      - name: Git LFS Checkout
        run: git lfs checkout
        working-directory: ${{ inputs.atom-data-sparse && 'tardis-regression-data' || 'stardis-regression-data' }}
  
      - name: Save LFS cache if not found
        uses: actions/cache/save@v4
        if: ${{ steps.test-lfs-cache-regression-data.outputs.cache-hit != 'true' }}
        with:
          path: ${{ inputs.atom-data-sparse && 'tardis-regression-data/.git/lfs' || 'stardis-regression-data/.git/lfs' }}
          key: ${{ inputs.atom-data-sparse && format('stardis-regression-atom-data-{0}-{1}-v1', hashFiles('tardis-regression-data/.lfs-files-list'), inputs.regression-data-repo) || format('stardis-regression-full-data-{0}-{1}-v1', hashFiles('stardis-regression-data/.lfs-files-list'), inputs.regression-data-repo) }}
